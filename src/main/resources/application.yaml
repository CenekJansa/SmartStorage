spring.config.import: optional:file:.env[.properties]

spring:
  sql:
    init:
      mode: always
      platform: postgres
      data-locations: 
       - classpath:sql/init-sections.sql


  graphql:
    graphiql:
      enabled: true
  application:
    name: SecureStorage

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: false  # Disable retries completely
        default-requeue-rejected: false  # Don't requeue rejected messages - remove them immediately

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securstorage}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  autoconfigure:
    exclude:
      # Disable vector store and embedding auto-configurations
      - org.springframework.ai.vectorstore.weaviate.autoconfigure.WeaviateVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.google.genai.GoogleGenAiAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

  # AI configuration for document processing
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: ${GOOGLE_GEN_AI_PROJECT_ID:}
        chat:
          options:
            model: gemini-2.5-flash
    # AI Prompt Configuration - customize prompts without code changes
    prompt:
      response-boundary: "|||"
      markdown-json-prefix: "```json"
      markdown-prefix: "```"
      instruction-template: "Your task is to read content of the document and create a json object from it.\n\n"
      content-section-template: "The content of the file:\n///\n{pdfText}\n///\n\n"
      filling-instruction-template: "Based on the file fill in the json object. Pay attention to the data types.\n\n"
      attributes-template: "The section has the following attributes: {attributes}\n\n"
      json-structure-header: "JSON object structure:\n"
      json-object-template: "{\n    \"name\": \"name of the item\",\n    \"metadata\": {\n{attributesList}\n    }\n}\n\n"
      attribute-entry-template: "        \"{attributeName}\": \"value\""
      final-instruction-template: "Return ONLY the JSON object, no additional text or explanation. The JSON response must be bounded by characters {boundary}\n"
      example-template: "For example: {boundary} { \"name\": \"...\", \"metadata\": { ... } } {boundary}"

logging:
  level:
    org:
      springframework:
        data:
          elasticsearch: DEBUG
      elasticsearch:
        client: DEBUG

# MinIO Configuration
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket:
    name: securestorage-bucket
