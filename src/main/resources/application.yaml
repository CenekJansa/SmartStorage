spring.config.import: optional:file:.env[.properties]

spring:
  sql:
    init:
      mode: always
      platform: postgres
      data-locations: 
       - classpath:sql/init-sections.sql


  graphql:
    graphiql:
      enabled: true
  application:
    name: SecureStorage

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: false  # Disable retries completely
        default-requeue-rejected: false  # Don't requeue rejected messages - remove them immediately

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securstorage}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  autoconfigure:
    exclude:
      # Disable vector store and embedding auto-configurations
      - org.springframework.ai.vectorstore.weaviate.autoconfigure.WeaviateVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.google.genai.GoogleGenAiAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

  # AI configuration for document processing
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: ${GOOGLE_GEN_AI_PROJECT_ID:}
        chat:
          options:
            model: gemini-2.5-flash

logging:
  level:
    org:
      springframework:
        data:
          elasticsearch: DEBUG
      elasticsearch:
        client: DEBUG

# MinIO Configuration
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket:
    name: securestorage-bucket
