spring:
  graphql:
    graphiql:
      enabled: true
  application:
    name: SecureStorage

  minio:
    url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket.name: securestorage-bucket

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securstorage}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  autoconfigure:
    exclude:
      # Disable all Spring AI auto-configurations to focus on CRUD operations
      - org.springframework.ai.vectorstore.weaviate.autoconfigure.WeaviateVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.google.genai.GoogleGenAiAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

  # AI configuration commented out - uncomment when ready to use AI features
  # ai:
  #   google:
  #     genai:
  #       api-key: ${GEMINI_API_KEY}
  #       project-id: ${GOOGLE_GEN_AI_PROJECT_ID}
  #       chat.options.model: gemini-2.5-flash
